<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jigyasafabrics.in | Sanganeri Hand-Block Printed Clothes & Fabrics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: '#800020',
            gold: '#D4AF37',
            offwhite: '#FAFAFA'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-offwhite text-gray-800 flex flex-col min-h-screen">

  <!-- Header & Navbar -->
  <header class="sticky top-0 z-50 bg-offwhite border-b border-gold/40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <h1 class="text-2xl font-bold tracking-wide text-maroon font-serif">Jigyasafabrics.in</h1>
        <span class="text-xs bg-gold/20 text-maroon font-semibold px-2 py-0.5 rounded">Jaipur</span>
      </div>

      <!-- B2B / B2C Toggle -->
      <div class="flex items-center bg-gray-200 p-1 rounded-full border border-gray-300">
        <button id="b2cBtn" onclick="setMode('b2c')" class="px-4 py-1.5 rounded-full text-xs font-semibold transition-all bg-maroon text-white shadow">
          Retail (B2C)
        </button>
        <button id="b2bBtn" onclick="setMode('b2b')" class="px-4 py-1.5 rounded-full text-xs font-semibold transition-all text-gray-700">
          Wholesale (B2B)
        </button>
      </div>

      <button onclick="toggleCart()" class="relative p-2 text-maroon font-semibold flex items-center gap-1">
        🛒 Cart <span id="cartCount" class="bg-maroon text-white text-xs px-2 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-maroon text-white py-12 px-4 text-center">
    <h2 class="text-3xl md:text-4xl font-serif font-bold text-gold mb-2">Authentic Sanganeri Hand-Block Prints</h2>
    <p class="text-sm md:text-base max-w-2xl mx-auto text-gray-200">
      Jaipur's Finest Heritage Apparel & Unstitched Running Fabrics for Retail & Wholesale Buyers.
    </p>
  </section>

  <!-- Product Catalog Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Products dynamically rendered via JS -->
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-4">
          <h3 class="text-xl font-bold text-maroon">Your Shopping Cart</h3>
          <button onclick="toggleCart()" class="text-gray-500 font-bold text-xl">&times;</button>
        </div>
        <div id="cartItemsList" class="mt-4 space-y-4"></div>
      </div>

      <div class="border-t pt-4">
        <div id="b2bFields" class="hidden mb-4 space-y-2">
          <input id="custName" type="text" placeholder="Your Name / business" class="w-full border p-2 text-sm rounded">
          <input id="custGst" type="text" placeholder="GSTIN Number (Optional)" class="w-full border p-2 text-sm rounded">
        </div>
        <div class="flex justify-between text-lg font-bold mb-4 text-maroon">
          <span>Total:</span>
          <span id="cartTotal">₹0</span>
        </div>
        <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded text-center">
          Order via WhatsApp 📲
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-300 text-center py-6 text-sm border-t border-gold/30">
    <p>© 2026 Jigyasafabrics.in - Jaipur, Rajasthan | Sanganeri Hand-Block Specialist</p>
  </footer>

  <script>
    const products = [
      {
        id: "sang-01",
        name: "Sanganeri Printed Cotton Kurti Set",
        category: "stitched",
        priceB2C: 1299,
        priceB2B: 650,
        moqB2B: 10,
        image: "https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500&q=80",
        sizes: ["S", "M", "L", "XL", "2XL"]
      },
      {
        id: "sang-02",
        name: "Chanderi Hand-Block Unstitched Fabric",
        category: "non-stitched",
        pricePerMeterB2C: 250,
        pricePerMeterB2B: 140,
        moqB2B: 20,
        minMetersB2C: 2,
        image: "https://images.unsplash.com/photo-1606744824163-985d376605aa?w=500&q=80"
      }
    ];

    let currentMode = 'b2c';
    let cart = [];

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('b2cBtn').className = mode === 'b2c' ? "px-4 py-1.5 rounded-full text-xs font-semibold bg-maroon text-white shadow" : "px-4 py-1.5 rounded-full text-xs font-semibold text-gray-700";
      document.getElementById('b2bBtn').className = mode === 'b2b' ? "px-4 py-1.5 rounded-full text-xs font-semibold bg-gold text-black shadow" : "px-4 py-1.5 rounded-full text-xs font-semibold text-gray-700";
      document.getElementById('b2bFields').className = mode === 'b2b' ? "block mb-4 space-y-2" : "hidden mb-4 space-y-2";
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('productGrid');
      container.innerHTML = products.map(p => {
        const isB2B = currentMode === 'b2b';
        const price = isB2B ? (p.priceB2B || p.pricePerMeterB2B) : (p.priceB2C || p.pricePerMeterB2C);
        const isStitched = p.category === 'stitched';

        return `
          <div class="bg-white rounded-lg shadow border border-gold/30 overflow-hidden flex flex-col justify-between">
            <img src="${p.image}" class="h-64 w-full object-cover" alt="${p.name}">
            <div class="p-4">
              <span class="text-xs bg-maroon text-white px-2 py-0.5 rounded uppercase font-semibold">${p.category}</span>
              <h3 class="font-serif font-bold text-maroon text-lg mt-2">${p.name}</h3>
              <p class="text-xl font-bold text-gray-900 mt-1">₹${price} <span class="text-xs text-gray-500">${isStitched ? '/ set' : '/ meter'}</span></p>
              ${isB2B ? `<p class="text-xs text-amber-800 bg-amber-50 p-1.5 mt-2 rounded border border-amber-200">MOQ: ${p.moqB2B} ${isStitched ? 'sets' : 'meters'}</p>` : ''}
              
              ${isStitched ? `
                <label class="text-xs font-bold block mt-3">Select Size:</label>
                <select id="size-${p.id}" class="w-full border rounded p-1 text-xs">
                  ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                </select>
              ` : `
                <label class="text-xs font-bold block mt-3">Select Meters:</label>
                <input id="meter-${p.id}" type="number" min="${isB2B ? p.moqB2B : p.minMetersB2C}" value="${isB2B ? p.moqB2B : p.minMetersB2C}" class="w-full border rounded p-1 text-xs">
              `}
            </div>
            <div class="p-4 pt-0">
              <button onclick="addToCart('${p.id}')" class="w-full bg-maroon text-white py-2 rounded font-bold text-sm hover:opacity-90">Add to Cart</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(productId) {
      const p = products.find(prod => prod.id === productId);
      const isStitched = p.category === 'stitched';
      const qty = isStitched 
        ? (currentMode === 'b2b' ? p.moqB2B : 1) 
        : parseInt(document.getElementById(`meter-${p.id}`).value) || 2;
      
      const size = isStitched ? document.getElementById(`size-${p.id}`).value : null;
      const price = currentMode === 'b2b' ? (p.priceB2B || p.pricePerMeterB2B) : (p.priceB2C || p.pricePerMeterB2C);

      cart.push({ ...p, selectedQty: qty, selectedSize: size, currentPrice: price });
      updateCartUI();
      toggleCart();
    }

    function updateCartUI() {
      document.getElementById('cartCount').innerText = cart.length;
      const list = document.getElementById('cartItemsList');
      let total = 0;
      list.innerHTML = cart.map((item, idx) => {
        const subtotal = item.currentPrice * item.selectedQty;
        total += subtotal;
        return `
          <div class="flex justify-between items-center border-b pb-2 text-sm">
            <div>
              <p class="font-bold text-maroon">${item.name}</p>
              <p class="text-xs text-gray-600">${item.selectedSize ? 'Size: ' + item.selectedSize : 'Meters: ' + item.selectedQty} x ₹${item.currentPrice}</p>
            </div>
            <span class="font-bold">₹${subtotal}</span>
          </div>
        `;
      }).join('');
      document.getElementById('cartTotal').innerText = `₹${total}`;
    }

    function toggleCart() {
      document.getElementById('cartModal').classList.toggle('hidden');
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) return alert('Cart is empty!');
      const phone = "919829000000"; // आपका व्हाट्सएप नंबर
      let msg = `*New Order - Jigyasafabrics.in*\nMode: ${currentMode.toUpperCase()}\n\n`;
      
      if (currentMode === 'b2b') {
        msg += `Business Name: ${document.getElementById('custName').value || 'N/A'}\n`;
        msg += `GSTIN: ${document.getElementById('custGst').value || 'N/A'}\n\n`;
      }

      msg += `*Items:*\n`;
      let total = 0;
      cart.forEach((item, i) => {
        const sub = item.currentPrice * item.selectedQty;
        total += sub;
        msg += `${i+1}. ${item.name} (${item.selectedSize || item.selectedQty + 'm'}) - ₹${sub}\n`;
      });
      msg += `\n*Total Amount:* ₹${total}`;

      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
